compute_environment: LOCAL_MACHINE
distributed_type: FSDP
num_processes: 4            # 按你的GPU数量改，比如8卡
mixed_precision: bf16       # BF16 更稳；如果卡只支持FP16，可改 fp16
downcast_bf16: no

